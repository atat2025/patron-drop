<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<title>PAT の板と流動性（非公開）</title>
<style>
  :root { --bg:#080a0d; --card:#12141a; --line:#23262e; --text:#eee; --muted:#8a8a99; --red:#ff0047; --green:#2ecc71; --yellow:#e8c547; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  body { max-width:430px; margin:0 auto; padding:16px 16px 40px; line-height:1.55; }
  h1 { font-size:18px; font-weight:600; margin:4px 0 2px; }
  h2 { font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.06em; margin:18px 0 8px; text-transform:none; }
  .sub { font-size:12px; color:var(--muted); margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:0 0 10px; }
  .price { font-size:32px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .price small { font-size:14px; color:var(--muted); font-weight:500; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-variant-numeric:tabular-nums; font-size:14px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--muted); }
  .row .v { text-align:right; font-weight:600; }
  .row .v small { display:block; font-weight:400; color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:11px; }
  td.r,th.r { text-align:right; }
  .warn { color:var(--yellow); font-weight:500; }
  .err { background:#2a1216; color:#ff8a9a; border-radius:8px; padding:10px 12px; font-size:13px; margin:8px 0; }
  .ok { color:var(--green); }
  .sell { color:var(--red); }
  .buy { color:var(--green); }
  .pill { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em; padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); vertical-align:middle; margin-left:6px; }
  .pill.lock { border-color:#e8c547; color:#e8c547; }
  .pill.open { border-color:#3a3d46; }
  .legend { display:flex; gap:14px; font-size:11px; color:var(--muted); margin:6px 0 0; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
  .legend .s { background:var(--red); } .legend .b { background:var(--green); }
  #chart { width:100%; height:auto; display:block; }
  .muted { color:var(--muted); font-size:12px; }
  .status { font-size:11px; color:var(--muted); margin-top:12px; text-align:center; }
  .empty { color:var(--muted); font-size:12px; margin-top:8px; word-break:break-all; }
  .pos-id { color:var(--muted); font-size:11px; }
</style>
</head>
<body>
  <div class="sub">非公開の確認用ページです。<span class="pill">検索に出しません</span></div>
  <h1>PAT の板と流動性</h1>
  <p class="sub">PAT / NVDA プール（Robinhood Chain）</p>

  <div id="err" class="err" style="display:none"></div>

  <h2>いまの価格とプールの合計</h2>
  <div class="card" id="summary">取得中…</div>

  <h2>板のグラフ</h2>
  <div class="card" id="chartCard">取得中…</div>

  <h2>上がり方の目安</h2>
  <div class="card" id="impact">取得中…</div>

  <h2>オーナーのポジション</h2>
  <div class="card" id="positions">取得中…</div>

  <p class="status" id="status">チェーンから数字を読み込んでいます…</p>
  <script src="./app.js"></script>
</body>
</html>
