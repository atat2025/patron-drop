# PATRON keepers on GitHub Actions (replaces the box loops). NOT active until merged to main AND secrets are added.
# Secrets needed: KEEPER_MAINNET_KEY (Sei mainnet keeper 0xe45a…aaFe), optional KEEPER_TESTNET_KEY.
name: keepers
on:
  schedule:
    - cron: "*/15 * * * *"   # price-sync (GitHub may delay scheduled runs by several minutes)
    - cron: "7 */3 * * *"    # plan keeper + Edition 0 keepers, every 3h
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: keepers, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/live-trading, path: app }
      - uses: actions/checkout@v4
        with: { ref: data-mainnet, path: data-mainnet }
      - uses: actions/checkout@v4
        with: { ref: data, path: data-testnet }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: app
      - name: price-sync (every run)
        working-directory: app
        env: { KEEPER_PRIVATE_KEY: "${{ secrets.KEEPER_MAINNET_KEY }}", LOG_OUT: ../data-mainnet/price-sync-log.json }
        run: node keeper/price-sync.mjs
      - name: 3-hourly keepers
        if: github.event.schedule == '7 */3 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: app
        env:
          MAIN_KEY: ${{ secrets.KEEPER_MAINNET_KEY }}
          TEST_KEY: ${{ secrets.KEEPER_TESTNET_KEY }}
        run: |
          KEEPER_PRIVATE_KEY=$MAIN_KEY LOG_OUT=../data-mainnet/plan-log.json node keeper/plan-keeper.mjs || true
          KEEPER_PRIVATE_KEY=$MAIN_KEY KEEPER_NET=mainnet FILLS_IN=../data-mainnet/market-fills.json LOG_OUT=../data-mainnet/keeper-log.json node keeper/keeper.mjs || true
          if [ -n "$TEST_KEY" ]; then KEEPER_PRIVATE_KEY=$TEST_KEY KEEPER_NET=testnet FILLS_IN=../data-testnet/market-fills.json LOG_OUT=../data-testnet/keeper-log.json node keeper/keeper.mjs || true; fi
      - name: save logs
        run: |
          for d in data-mainnet:data-mainnet data-testnet:data; do dir=${d%%:*}; br=${d##*:}; cd $GITHUB_WORKSPACE/$dir
            git config user.name patron-keeper; git config user.email patron-keeper@users.noreply.github.com
            git add -A; git diff --cached --quiet || { git commit -qm "keeper (actions) $(date -u +%FT%TZ)"; git pull -q --rebase origin $br; git push -q origin HEAD:$br; }
          done
